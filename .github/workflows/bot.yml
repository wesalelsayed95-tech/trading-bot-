name: Airdrop Farmer Bot

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:      

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.9'

      - name: Install dependencies
        run: pip install web3 eth-account

      - name: Run Bot
        run: python bot.py

      - name: Commit changes
        run: |
          git config --global user.name "bot"
          git config --global user.email "bot@example.com"
          git add wallets.json
          git commit -m "Update farming data" || echo "No changes to commit"
          git push
